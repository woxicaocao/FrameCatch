<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'" />
  <title>映取 · 浏览器辅助分析</title>
  <style>
    :root{font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei",sans-serif;font-synthesis:none;color:#43543a;background:#f7f9f2;font-size:12px;-webkit-font-smoothing:antialiased}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:178px;overflow:hidden}button,select{font:inherit}button{cursor:pointer;color:inherit}button:disabled,select:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,select:focus-visible{outline:2px solid #9bba98;outline-offset:2px}svg{flex-shrink:0}button svg{pointer-events:none}
    .toolbar{height:178px;padding:12px 18px 10px;border-bottom:1px solid #dfe7d5;display:flex;flex-direction:column;gap:8px;overflow:hidden}
    .header{display:flex;justify-content:space-between;align-items:center;gap:15px;min-height:24px;flex-shrink:0}.brand{display:flex;align-items:center;gap:8px;white-space:nowrap}.brand-mark{width:23px;height:23px;border-radius:6px;display:grid;place-items:center;background:#45644a;color:#f7f7ec}.brand strong{font-size:13px;font-weight:600;letter-spacing:.5px}.brand small{font-size:9px;color:#9aa98c;border-left:1px solid #dce4d1;margin-left:2px;padding-left:9px}.steps{display:flex;align-items:center;gap:8px;white-space:nowrap;color:#879877;font-size:10px}.steps>span{display:flex;gap:5px;align-items:center}.steps b{font-size:8px;font-weight:500;background:#eaf0e0;border:1px solid #dce6d0;border-radius:50%;width:15px;height:15px;display:inline-grid;place-items:center;color:#81976e}.steps i{font-style:normal;color:#b4c0a6}
    .page-bar{display:flex;gap:6px;align-items:center;min-height:33px;flex-shrink:0}.nav-button{border:1px solid #e0e7d7;background:#fcfdf9;border-radius:5px;width:30px;height:30px;display:grid;place-items:center;color:#8ca078}.nav-button:hover:enabled{background:#edf3e4;color:#5f7950}.page-info{height:32px;display:flex;align-items:center;gap:9px;min-width:0;flex:1;background:#fff;border:1px solid #e1e8d9;border-radius:5px;padding:0 10px}.page-info>svg{color:#a2b191}.page-title{font-size:10px;color:#7e936b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}.page-origin{font-size:9px;color:#abb79d;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.page-state{display:flex;align-items:center;gap:4px;font-size:9px;color:#9aae86;white-space:nowrap;margin:0 6px}.page-state>span{width:4px;height:4px;border-radius:50%;background:#9eb583}.page-state.loading>span{animation:pulse 1.3s ease-in-out infinite}.cancel-button{border:1px solid #e1e7d7;background:#fff;color:#8e9b81;font-size:10px;border-radius:5px;padding:7px 11px;min-height:30px;white-space:nowrap}.cancel-button:hover{background:#f1f5e9}
    .media-bar{display:flex;gap:10px;align-items:center;min-height:33px;flex-shrink:0}.media-label{display:flex;align-items:center;gap:5px;color:#7a8f67;font-size:10px;white-space:nowrap}.count{font-size:8px;line-height:16px;min-width:17px;border-radius:4px;background:#e9efdf;color:#8b9f76;display:inline-block;text-align:center;padding:0 4px}.candidate-wrap{position:relative;display:flex;align-items:center;flex:1;min-width:0}.candidate-select{width:100%;height:33px;padding:6px 29px 6px 10px;border-radius:5px;border:1px solid #dce6d1;background:#fff;color:#72895f;appearance:none;min-width:0;outline-offset:2px;font-size:11px;cursor:pointer}.candidate-wrap>svg{position:absolute;right:9px;color:#9dae8c;pointer-events:none}.select-button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:33px;border:0;border-radius:5px;padding:8px 13px;background:#45654b;color:#fff;font-size:10px;font-weight:550;white-space:nowrap}.select-button:hover:enabled{background:#344f3a}.select-button.busy svg{animation:spin 1s linear infinite}
    .footer{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;min-height:26px;flex:1}.message{font-size:9px;color:#8c9d7e;line-height:1.8;flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;margin:0}.message.error{color:#af8760}.privacy{display:flex;gap:4px;align-items:center;flex-shrink:0;font-size:8px;color:#a7b49a;line-height:1.8;margin-top:1px;white-space:nowrap}
    @keyframes pulse{50%{opacity:.3}}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:980px){.toolbar{padding-left:13px;padding-right:13px}.brand small{display:none}.steps{gap:6px;font-size:9px}.steps b{width:13px;height:13px;font-size:7px}.page-origin{max-width:130px}.page-state{margin:0 2px}.privacy{font-size:7px}.media-label{font-size:9px}.footer{gap:9px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <script defer src="browser-helper.js"></script>
</head>
<body>
  <main class="toolbar" aria-label="浏览器辅助分析工具栏">
    <header class="header">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4m-4 8h4M17 8h4m-4 8h4"/></svg></span><strong>浏览器辅助分析</strong><small>映取 FrameCatch</small></div>
      <div class="steps" aria-label="操作步骤"><span><b>1</b>在下方播放视频</span><i>→</i><span><b>2</b>选择检测到资源</span><i>→</i><span><b>3</b>分析所选资源</span></div>
    </header>
    <div class="page-bar">
      <button data-testid="helper-back" id="back" class="nav-button" title="返回上一页" aria-label="返回上一页" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m14 6-6 6 6 6"/></svg></button>
      <button data-testid="helper-reload" id="reload" class="nav-button" title="刷新网页" aria-label="刷新网页" disabled><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 18 17"/></svg></button>
      <div class="page-info"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></svg><span id="page-title" class="page-title">正在准备隔离浏览器…</span><span id="page-origin" class="page-origin"></span></div>
      <span id="page-state" class="page-state"><span></span><i id="loading-label" style="font-style:normal">准备中</i></span>
      <button data-testid="helper-cancel" id="cancel" class="cancel-button">取消分析</button>
    </div>
    <div class="media-bar"><label class="media-label" for="candidate">检测到的媒体 <span id="count" class="count">0</span></label><span class="candidate-wrap"><select data-testid="helper-candidate" id="candidate" class="candidate-select" aria-label="检测到的媒体资源" disabled><option value="">等待检测，请在下方播放视频…</option></select><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span><button data-testid="helper-select" id="select" class="select-button" disabled><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m5 12 4 4L19 6"/></svg><span id="select-label">分析所选资源</span></button></div>
    <footer class="footer"><p id="message" class="message" role="status">请在下方播放目标视频；登录或网站验证请手动完成。部分站点的媒体可能无法提取。</p><span class="privacy"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6l-8-3Z"/><path d="m8 12 3 3 5-6"/></svg>本机隔离会话 · 不读取 Chrome 登录数据</span></footer>
  </main>
</body>
</html>
